# 公开模板 patch：只保留需要覆盖的配置项（当前仅「设置页公告版本」）
#   ⛔ 启动动画插件（dsh-boot-anim / @ljwei-stak/dsh-boot-animation）2026-11-10 已弃用：
#      依赖与 bundles 均已清空，这里不要再手写 boot-anim 的 insert —— 名字对不上
#      package.json 的 name 就会 ERR_MODULE_NOT_FOUND，每次启动刷一条 did not activate。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# ---- 2026-11-12 用户拍板启用（评估：doc\工具启用价值评估.md §3）----
# 只加这三个；其余 6 个按报告保持关闭。删掉对应行即关闭。
- id: tool-ask-user
  name: "@deepseek-ai/dsh-tool-ask-user"

- id: tool-present
  name: "@deepseek-ai/dsh-tool-present"

- id: tool-schedule
  name: "@deepseek-ai/dsh-tool-schedule"

# ---- 2026-11-13 记忆回响：每轮用户发言前注入 §〇 / 近期 / 相关条目（工具\记忆回响.mjs 装）----
- insert:
    - id: memory-recall
      name: "dsh-memory-recall"
      config:
        mode: enforce
