<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 · Live2D</title>
<style>
  /* 主题令牌：body[data-theme] 切换背景与文字（亮=贴概念图 / 暗=深色面板） */
  :root {
    --text: #2a3340;
    --text-dim: #6a7688;
    --accent: #4a7fd4;
    --panel-bg: rgba(255, 255, 255, .78);
    --panel-border: rgba(15, 23, 42, .16);
    --hover: rgba(15, 23, 42, .06);
  }
  body[data-theme="dark"] {
    --text: #e6e8ee;
    --text-dim: #8b95a7;
    --accent: #6ea8fe;
    --panel-bg: rgba(13, 17, 23, .72);
    --panel-border: rgba(148, 163, 184, .28);
    --hover: rgba(148, 163, 184, .10);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    user-select: none;
    color: var(--text);
  }
  body {
    background: radial-gradient(ellipse at 50% 30%, #f6f8fc 0%, #dce5f1 70%);
  }
  body[data-theme="dark"] {
    background: radial-gradient(ellipse at 50% 32%, #1a2332 0%, #0d1117 68%);
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 状态徽标：右下角，四态一眼可见（验收与调试用） */
  #badge {
    position: fixed; right: 12px; bottom: 12px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1;
    color: var(--text); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 7px;
    pointer-events: none;
  }
  #badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  #badge.st-idle .dot { background: #7ee787; }
  #badge.st-thinking .dot { background: #d2a8ff; }
  #badge.st-speaking .dot { background: #6ea8fe; }
  #badge.st-listening .dot { background: #f2cc60; }

  /* 模型名：左上角，换模型后不用猜当前加载的是哪一份 */
  #model-label {
    position: fixed; left: 12px; top: 12px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1;
    color: var(--text-dim); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    pointer-events: none;
  }
  #model-label[hidden] { display: none; }

  /* 加载 / 失败提示：居中 */
  #hint {
    position: fixed; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--text-dim); font-size: 13px;
    pointer-events: none; text-align: center; padding: 28px;
  }
  #hint[hidden] { display: none; }
  #btn-retry {
    pointer-events: auto; padding: 6px 16px; border-radius: 999px;
    font-size: 12px; line-height: 1.4; color: var(--text);
    background: var(--hover); border: 1px solid var(--panel-border);
    cursor: pointer;
  }
  #btn-retry[hidden] { display: none; }

  /* 兜底：模型没接入时显示立绘占位，不让整页空白 */
  #fallback {
    position: fixed; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 18px; box-sizing: border-box;
    pointer-events: none;
  }
  #fallback[hidden] { display: none; }
  #fallback-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center bottom;
    animation: fb-breathe 4.2s ease-in-out infinite;
    transform-origin: 50% 92%;
  }
  @keyframes fb-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.012); }
  }
  .fb-card {
    position: relative; max-width: 248px; padding: 10px 12px;
    border-radius: 10px; font-size: 12px; line-height: 1.55;
    color: var(--text); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
  }
  .fb-card .fb-title { font-size: 13px; margin-bottom: 2px; }
  .fb-card .fb-sub { color: var(--text-dim); }
  .fb-card code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }

  /* 关闭态：整页占位 + 常驻「开启」入口 */
  #off {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center;
    background: inherit;
  }
  #off.on { display: flex; }
  #off .off-title { font-size: 14px; }
  #off .off-sub { font-size: 12px; line-height: 1.5; color: var(--text-dim); max-width: 240px; }
  #btn-render-on {
    margin-top: 2px; padding: 8px 18px; border-radius: 999px;
    font-size: 13px; line-height: 1.4;
    color: #fff; background: var(--accent);
    border: 1px solid transparent; cursor: pointer;
  }
  #btn-render-on:hover { filter: brightness(1.06); }

  /* 设置：右上角常驻文字入口 + 浮层 */
  #btn-settings {
    position: fixed; top: 12px; right: 12px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1.4;
    color: var(--text); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    cursor: pointer;
  }
  #btn-settings:hover { background: var(--hover); }
  #settings-panel {
    position: fixed; top: 44px; right: 12px;
    min-width: 220px; padding: 12px;
    border-radius: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    display: flex; flex-direction: column; gap: 10px;
    font-size: 13px;
  }
  #settings-panel[hidden] { display: none; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .set-row .val { color: var(--text-dim); font-size: 12px; min-width: 28px; text-align: right; }
  .set-note { margin-top: -4px; font-size: 12px; line-height: 1.5; color: var(--text-dim); word-break: break-all; }

  .switch { position: relative; display: inline-block; width: 34px; height: 18px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(120, 130, 145, .45);
    transition: background .2s;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: left .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .knob { left: 18px; }

  #btn-close, .mini-btn {
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1.4;
    color: var(--text); background: var(--hover);
    border: 1px solid var(--panel-border);
    cursor: pointer;
  }
  #btn-close { align-self: flex-end; }
  .mini-btn:hover, #btn-close:hover { background: var(--panel-bg); }
</style>
</head>
<body data-theme="bright">
  <div id="stage"></div>
  <div id="model-label" hidden></div>
  <div id="badge" class="st-idle"><span class="dot"></span><span id="badge-text">待机</span></div>
  <div id="fallback" hidden>
    <img id="fallback-img" alt="大肥鱼立绘">
    <div class="fb-card">
      <div class="fb-title">Live2D 模型未接入</div>
      <div class="fb-sub" id="fb-sub">当前显示立绘占位。把 Cubism 导出的模型放进 <code>模型/正式/</code>，再把 <code>模型/当前.json</code> 的 model 指向 <code>*.model3.json</code>。</div>
    </div>
  </div>
  <div id="hint"><span id="hint-text">模型加载中…</span><button id="btn-retry" hidden>重试</button></div>
  <div id="off">
    <div class="off-title">Live2D 渲染已暂停</div>
    <div class="off-sub">画面已停帧，不再轮询状态；想看了再点下面开启。</div>
    <button id="btn-render-on">开启 Live2D 渲染</button>
  </div>

  <button id="btn-settings" title="渲染设置">设置</button>
  <div id="settings-panel" hidden>
    <div class="set-row">
      <span>Live2D 渲染</span>
      <label class="switch"><input type="checkbox" id="set-render"><span class="track"><span class="knob"></span></span></label>
      <span class="val" id="set-render-val">开</span>
    </div>
    <div class="set-note">关掉后停帧、停状态轮询；选择会记住。</div>
    <div class="set-row">
      <span>亮色背景</span>
      <label class="switch"><input type="checkbox" id="set-theme"><span class="track"><span class="knob"></span></span></label>
      <span class="val" id="set-theme-val">开</span>
    </div>
    <div class="set-row">
      <span>缩放</span>
      <button id="btn-view-reset" class="mini-btn" title="回到默认大小与位置">复位</button>
    </div>
    <div class="set-row">
      <span>模型</span>
      <button id="btn-model-reload" class="mini-btn" title="重新读取 模型/当前.json">重新载入</button>
    </div>
    <div class="set-note" id="model-note">模型：—</div>
    <button id="btn-close">完成</button>
  </div>

  <script>
    // 模块链断了（404 / 网络）时把原因上屏，别停在静态初始文案上
    window.addEventListener('error', function (e) {
      var t = document.getElementById('hint-text');
      var h = document.getElementById('hint');
      if (t && h) { h.hidden = false; t.textContent = '加载失败：' + (e.message || '未知错误'); }
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      var t = document.getElementById('hint-text');
      var h = document.getElementById('hint');
      if (t && h) { h.hidden = false; t.textContent = '运行出错：' + String((r && r.message) || r || '未知错误'); }
    });
  </script>
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/pixi.min.js"></script>
  <script src="./vendor/pixi-live2d-display.cubism4.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
