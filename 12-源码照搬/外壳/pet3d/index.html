<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 · 3D</title>
<style>
  /* 主题令牌：body[data-theme] 切换渲染风格（亮=调整后 / 暗=调整前） */
  :root {
    --text: #2a3340;
    --text-dim: #6a7688;
    --accent: #4a7fd4;
    --panel-bg: rgba(255, 255, 255, .78);
    --panel-border: rgba(15, 23, 42, .16);
    --hover: rgba(15, 23, 42, .06);
  }
  body[data-theme="dark"] {
    --text: #e6e8ee;
    --text-dim: #8b95a7;
    --accent: #6ea8fe;
    --panel-bg: rgba(13, 17, 23, .72);
    --panel-border: rgba(148, 163, 184, .28);
    --hover: rgba(148, 163, 184, .10);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    user-select: none;
    color: var(--text);
  }
  body {
    background: radial-gradient(ellipse at 50% 30%, #f6f8fc 0%, #dce5f1 70%);
  }
  body[data-theme="dark"] {
    background: radial-gradient(ellipse at 50% 32%, #1a2332 0%, #0d1117 68%);
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 状态徽标：右下角，四态一眼可见（验收与调试用） */
  #badge {
    position: fixed; right: 12px; bottom: 12px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1;
    color: var(--text); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 7px;
    pointer-events: none; transition: border-color .3s;
  }
  #badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  #badge.st-idle .dot { background: #7ee787; }
  #badge.st-thinking .dot { background: #d2a8ff; }
  #badge.st-speaking .dot { background: #6ea8fe; }
  #badge.st-listening .dot { background: #f2cc60; }

  /* 视角提示：左下角，首次渲染时出现 7 秒后淡出（拖动/滚轮是直接操作，不用常驻） */
  #view-hint {
    position: fixed; left: 12px; bottom: 12px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1;
    color: var(--text-dim); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    pointer-events: none; opacity: 0;
    transition: opacity .35s;
  }
  #view-hint.on { opacity: 1; }

  /* 加载 / 失败提示：居中 */
  #hint {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 13px;
    pointer-events: none; text-align: center; padding: 24px;
  }

  /* 关闭态：整页占位 + 一个显眼的「开启」入口（关掉后不画帧，不再占显卡） */
  #off {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center;
    background: inherit;
  }
  #off.on { display: flex; }
  #off .off-title { font-size: 14px; }
  #off .off-sub { font-size: 12px; line-height: 1.5; color: var(--text-dim); max-width: 240px; }
  #btn-render-on {
    margin-top: 2px; padding: 8px 18px; border-radius: 999px;
    font-size: 13px; line-height: 1.4;
    color: #fff; background: var(--accent);
    border: 1px solid transparent; cursor: pointer;
  }
  #btn-render-on:hover { filter: brightness(1.06); }

  /* 设置：右上角常驻文字入口 + 浮层（默认安全：只改展示，随时可还原） */
  #btn-settings {
    position: fixed; top: 12px; right: 12px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1.4;
    color: var(--text); background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    cursor: pointer;
  }
  #btn-settings:hover { background: var(--hover); }
  #settings-panel {
    position: fixed; top: 44px; right: 12px;
    min-width: 208px; padding: 12px;
    border-radius: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    display: flex; flex-direction: column; gap: 10px;
    font-size: 13px;
  }
  #settings-panel[hidden] { display: none; }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .set-row .val { color: var(--text-dim); font-size: 12px; min-width: 28px; text-align: right; }
  .set-note { margin-top: -4px; font-size: 12px; line-height: 1.5; color: var(--text-dim); }

  /* switch：checkbox + 轨道 */
  .switch { position: relative; display: inline-block; width: 34px; height: 18px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(120, 130, 145, .45);
    transition: background .2s;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transition: left .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .knob { left: 18px; }

  #btn-close {
    align-self: flex-end;
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1.4;
    color: var(--text); background: var(--hover);
    border: 1px solid var(--panel-border);
    cursor: pointer;
  }
  .mini-btn {
    padding: 3px 12px; border-radius: 999px;
    font-size: 12px; line-height: 1.4;
    color: var(--text); background: var(--hover);
    border: 1px solid var(--panel-border);
    cursor: pointer;
  }
  .mini-btn:hover { background: var(--panel-bg); }
</style>
</head>
<body data-theme="bright">
  <div id="stage"></div>
  <div id="badge" class="st-idle"><span class="dot"></span><span id="badge-text">待机</span></div>
  <div id="view-hint">拖动旋转 · 滚轮缩放</div>
  <div id="hint">模型加载中…</div>
  <div id="off">
    <div class="off-title">3D 渲染已关闭</div>
    <div class="off-sub">画面已暂停，不再占显卡；想看了再点下面开启。</div>
    <button id="btn-render-on">开启 3D 渲染</button>
  </div>

  <button id="btn-settings" title="渲染设置">设置</button>
  <div id="settings-panel" hidden>
    <div class="set-row">
      <span>3D 渲染</span>
      <label class="switch"><input type="checkbox" id="set-render"><span class="track"><span class="knob"></span></span></label>
      <span class="val" id="set-render-val">开</span>
    </div>
    <div class="set-note">关掉后不画帧、不刷状态，电脑不卡；选择会记住。</div>
    <div class="set-row">
      <span>亮色渲染</span>
      <label class="switch"><input type="checkbox" id="set-theme"><span class="track"><span class="knob"></span></span></label>
      <span class="val" id="set-theme-val">开</span>
    </div>
    <div class="set-row">
      <span>描边</span>
      <label class="switch"><input type="checkbox" id="set-outline"><span class="track"><span class="knob"></span></span></label>
      <span class="val" id="set-outline-val">开</span>
    </div>
    <div class="set-row">
      <span>视角</span>
      <button id="btn-view-reset" class="mini-btn" title="回到正面视角">复位</button>
    </div>
    <button id="btn-close">完成</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script>
    // 模块链断了（404 / 网络）时把原因上屏，别停在静态初始文案上
    window.addEventListener('error', function (e) {
      var h = document.getElementById('hint');
      if (h) h.textContent = '模块加载失败：' + (e.message || '未知错误');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      var h = document.getElementById('hint');
      if (h) h.textContent = '运行出错：' + String((r && r.message) || r || '未知错误');
    });
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
